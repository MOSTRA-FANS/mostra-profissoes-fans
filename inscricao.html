<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base-url" content="">
    <title>Inscrição — Mostra de Profissões FANS</title>
    <meta name="description" content="Formulário de interesse da Mostra de Profissões FANS">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/main.js" defer></script>
    <script src="js/subscription.js" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <div id="header-placeholder"></div>
    <main class="mx-auto max-w-4xl px-4 py-12">
        <header class="mb-8">
            <p class="font-semibold uppercase tracking-widest text-blue-700">Mostra de Profissões FANS</p>
            <h1 class="mt-2 text-3xl font-bold md:text-4xl">Formulário de interesse</h1>
            <p class="mt-3 max-w-2xl text-slate-600">Conte qual curso você deseja conhecer. Cada e-mail pode enviar uma resposta.</p>
        </header>
        <form id="subscription-form" class="space-y-6 rounded-2xl bg-white p-6 shadow-lg md:p-10">
            <div class="grid gap-6 md:grid-cols-2">
                <label class="md:col-span-2"><span class="mb-2 block font-semibold">Nome completo *</span>
                    <input name="nome" required maxlength="150" autocomplete="name" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label><span class="mb-2 block font-semibold">Idade *</span>
                    <input name="idade" required type="number" min="1" max="120" inputmode="numeric" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label><span class="mb-2 block font-semibold">Telefone com DDD *</span>
                    <input name="telefone" required maxlength="20" autocomplete="tel" placeholder="(37) 99999-9999" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label class="md:col-span-2"><span class="mb-2 block font-semibold">E-mail *</span>
                    <input name="email" required type="email" maxlength="320" autocomplete="email" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label><span class="mb-2 block font-semibold">Curso atual de interesse *</span>
                    <select name="curso" required disabled class="w-full rounded-lg border border-slate-300 bg-white p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200"><option value="">Carregando cursos...</option></select>
                </label>
                <label><span class="mb-2 block font-semibold">Novo curso de interesse</span>
                    <select name="novo" disabled class="w-full rounded-lg border border-slate-300 bg-white p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200"><option value="">Nenhum</option></select>
                </label>
                <label><span class="mb-2 block font-semibold">Como soube da Mostra?</span>
                    <select name="saber" class="w-full rounded-lg border border-slate-300 bg-white p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                        <option value="">Prefiro não informar</option><option>Instagram</option><option>WhatsApp</option><option>Professor</option><option>Amigo/Colega</option><option>Site da faculdade</option><option>Cartaz</option><option>Outro</option>
                    </select>
                </label>
                <label><span class="mb-2 block font-semibold">Outro interesse</span>
                    <input name="outro" maxlength="100" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200">
                </label>
                <label class="md:col-span-2"><span class="mb-2 block font-semibold">Comentário ou sugestão</span>
                    <textarea name="feedback" maxlength="5000" rows="4" class="w-full rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea>
                </label>
            </div>
            <label class="flex items-start gap-3"><input name="novidade" type="checkbox" class="mt-1 h-5 w-5 rounded border-slate-300 text-blue-700"><span>Quero receber novidades sobre a FANS.</span></label>
            <div id="subscription-status" role="status" aria-live="polite" class="hidden rounded-lg p-4"></div>
            <button id="subscription-submit" type="submit" disabled class="rounded-full bg-blue-700 px-8 py-3 font-bold text-white transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">Enviar inscrição</button>
        </form>
    </main>
    <div id="footer-placeholder"></div>
</body>
</html>
